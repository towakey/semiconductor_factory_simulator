<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>半導体工場シミュレーター</title>
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<header id="toolbar">
  <label>モデル <select id="model"></select></label>
  <label>run <select id="run"></select></label>
  <label>ルール <select id="rule">
    <option>FIFO</option><option>PRIORITY</option><option>EDD</option>
    <option>SPT</option><option>MIN_SETUP</option><option>CR</option>
  </select></label>
  <label>シード <input id="seed" type="number" value="1" min="0"></label>
  <label>期間(分) <input id="duration" type="number" value="20160"></label>
  <button id="btnRun">実行</button>
  <button id="btnCancel" disabled>キャンセル</button>
  <button id="btnEdit">レイアウト編集</button>
  <button onclick="location.href='modeledit.html?model='+encodeURIComponent(document.getElementById('model').value)">モデル設定</button>
  <button id="btnResults">結果</button>
  <span id="status">待機</span><span id="layNote" style="font-size:10px;color:#8aa" title="run は開始時点のレイアウトを使用します">(レイアウトは run 作成時点)</span>
</header>
<main>
  <div id="canvasWrap"><canvas id="cv"></canvas></div>
  <aside id="side">
    <div id="selInfo"><h3>選択中オブジェクト</h3><pre id="selBody">-</pre></div>
    <div id="kpi"><h3>現在の KPI</h3><pre id="kpiBody">-</pre></div>
    <div id="legend">
      <h3>凡例</h3>
      <span class="lg" style="background:#4caf50">BUSY</span>
      <span class="lg" style="background:#9e9e9e">IDLE</span>
      <span class="lg" style="background:#4fc3f7">RESERVED</span>
      <span class="lg" style="background:#ff9800">SETUP</span>
      <span class="lg" style="background:#e53935">DOWN</span>
      <span class="lg" style="background:#fdd835">PM</span>
      <span class="lg" style="background:#fff;border:1px solid #888">AGV空走</span>
      <span class="lg" style="background:#7e57c2">AGV実走/ロット</span>
      <span class="lg" style="background:#ff5252">ホットロット</span>
    </div>
  </aside>
</main>
<footer id="player">
  <button id="btnRew" title="先頭へ">&#9198;</button>
  <button id="btnPlay" title="再生">&#9654;</button>
  <button id="btnLive">ライブ</button>
  <span id="speeds">
    <button data-s="1">x1</button><button data-s="10">x10</button>
    <button data-s="100" class="on">x100</button><button data-s="1000">x1000</button>
  </span>
  <span id="clock">0d 00:00</span>
  <input id="seek" type="range" min="0" max="1000" value="0">
</footer>
<script src="shapes.js?v=20261103c"></script>
<script src="viewer.js?v=20261103c"></script>
<script src="layoutedit.js?v=20261103c"></script>
</body>
</html>
