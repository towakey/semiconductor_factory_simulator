<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シミュレーション結果</title>
<link rel="stylesheet" href="results.css?v=20261103h">
</head>
<body>
<header>
  <strong>シミュレーション結果</strong>
  <label>run <select id="run"></select></label>
  <button id="refresh">更新</button>
  <span id="status">-</span>
  <a id="viewer" href="index.html">ビューアーへ戻る</a>
</header>
<section class="controls">
  <div class="time-controls">
    <label class="grow">時点 <input id="slider" type="range" min="0" max="0" step="1" value="0"></label>
    <label>日 <input id="day" type="number" min="0" value="0"></label>
    <label>時 <input id="hour" type="number" min="0" max="23" value="0"></label>
    <label>分 <input id="minute" type="number" min="0" max="59" value="0"></label>
    <button id="prev">◀ 1時間</button><button id="next">1時間 ▶</button>
    <button id="last">最終時点</button>
  </div>
  <div class="mode-controls">
    <label><input type="radio" name="mode" value="cum" checked> 累積(0〜時点)</label>
    <label><input type="radio" name="mode" value="window"> 区間(直前 N 時間)</label>
    <select id="windowPreset" disabled>
      <option value="60">1時間</option><option value="480">8時間</option>
      <option value="1440">24時間</option><option value="10080">168時間</option>
      <option value="custom">任意</option>
    </select>
    <label>分 <input id="windowCustom" type="number" min="1" value="1440" disabled></label>
    <small>WIP は常に選択時点の瞬時値です。モードは実績・状態時間・待ち時間に適用。</small>
  </div>
</section>
<nav id="tabs">
  <button data-tab="total" class="active">全体</button>
  <button data-tab="groups">装置グループ</button>
  <button data-tab="equips">装置</button>
  <button id="download">CSV ダウンロード</button>
</nav>
<main>
  <section id="summary"></section>
  <details id="chartSection" open>
    <summary>推移グラフ</summary>
    <div class="chart-controls">
      <label>指標
        <select id="chartMetric">
          <option value="wip">WIP(合計)</option>
          <option value="wip_wait">WIP(待ち)</option>
          <option value="wip_equip">WIP(設備上)</option>
          <option value="utilization">稼働率(BUSY/(P−PM−DOWN))</option>
          <option value="utilization_gross">稼働率(BUSY/P)</option>
          <option value="completed_steps">完了工程数</option>
          <option value="avg_process_time">平均処理時間</option>
          <option value="avg_wait">平均ディスパッチ待ち</option>
          <option value="state_time">状態時間</option>
          <option value="completed_lots">完了ロット数(全体)</option>
          <option value="avg_cycle_time">平均サイクルタイム(全体)</option>
          <option value="on_time_rate">納期遵守率(全体)</option>
        </select>
      </label>
      <label>対象 <select id="chartScope">
        <option value="total">全体</option>
        <option value="group">装置グループ</option>
        <option value="equip">装置</option>
      </select></label>
      <label>刻み <select id="chartStep">
        <option value="60">1時間</option><option value="360">6時間</option>
        <option value="1440">24時間</option><option value="custom">任意</option>
      </select></label>
      <label>分 <input id="chartStepCustom" type="number" min="1" value="60" disabled></label>
      <label><input type="radio" name="chartMode" value="bucket" checked> バケット毎</label>
      <label><input type="radio" name="chartMode" value="cum"> 累積</label>
      <button id="chartAddTotal">全体を系列に追加</button>
      <button id="chartCsv">グラフCSV</button>
      <small id="chartHint">行をクリックして系列を追加/削除(最大6)。WIP は各時点の瞬時値。</small>
    </div>
    <div id="chartLegend"></div>
    <div id="chartWrap">
      <canvas id="chartCanvas" aria-label="時系列推移グラフ"></canvas>
      <div id="chartTooltip" hidden></div>
    </div>
  </details>
  <section id="filters" hidden>
    <label>グループ <select id="groupFilter"><option value="">すべて</option></select></label>
    <label>エリア <select id="areaFilter"><option value="">すべて</option></select></label>
  </section>
  <section class="table-wrap" id="tableWrap">
    <table id="table"><thead></thead><tbody></tbody></table>
  </section>
</main>
<script src="results-chart.js?v=20261103h"></script>
<script src="results.js?v=20261103h"></script>
</body>
</html>
